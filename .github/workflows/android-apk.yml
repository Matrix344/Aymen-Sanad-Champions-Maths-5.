name: Construire l'APK Android

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Recuperer le projet
        uses: actions/checkout@v4

      - name: Installer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Installer Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Installer Android SDK
        uses: android-actions/setup-android@v3

      - name: Construire l'APK
        run: gradle assembleDebug

      - name: Publier l'APK a telecharger
        uses: actions/upload-artifact@v4
        with:
          name: Aymen-Sanad-Champions-des-Maths-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
